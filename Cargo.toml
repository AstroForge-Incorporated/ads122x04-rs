[package]
name = "ads122x04"
authors = ["Linus Leo Stöckli"]
version = "0.3.0"
edition = "2021"
repository = "https://github.com/hacknus/ads122x04-rs"
description = "Platform-agnostic driver for the ADS122C04 and ADS122U04 analog to digital converters."
readme = "README.md"
keywords = ["adc", "adc122u04", "adc122c04", "driver", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]
documentation = "https://docs.rs/ads122x04"
homepage = "https://github.com/hacknus/ads122x04-rs"
license = "Apache-2.0"

[dependencies]
defmt = { version = "1.0.1", optional = true }
embedded-hal = { version = "1.0" }
embedded-hal-nb = "1.0"
nb = "1.1.0"

[features]
# include defmt log statements
defmt = ["dep:defmt"]
